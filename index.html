<title>Кабинет провайдера — макеты</title>
<!--
  Шаблон копии холстов одним файлом (задача 39). Собирает .claude/tools/build-public.mjs:
  вместо меток ниже встают токены дизайн-системы и данные копии — исходники обоих холстов,
  модуль рисования dc-render.js, ассеты, дата сборки и коммит. Сам шаблон текста макета не
  содержит: названия экранов и строки словарей — только в данных.

  Данные закрыты паролем: в `#pc-data` — не они, а шифротекст (AES-256-GCM, ключ —
  PBKDF2-SHA-256 из пароля; вид — `seal()` сборщика). Сначала страница показывает форму
  пароля, расшифровывает данные WebCrypto браузера и только потом рисует копию —
  `startCopy(data)`. Ключ верного пароля хранится в sessionStorage до закрытия вкладки:
  перезагрузка и переход по ссылке в той же вкладке пароля не спрашивают. WebCrypto есть
  только в безопасном окне — https, localhost и файл с диска; на http по адресу сети форма
  говорит, что открыть нельзя.

  Имён холстов, страниц и экранов нет и в комментариях этого шаблона, даже примерами: сборка
  ищет их в готовой странице и падает, если найдёт.

  Как устроено. Адрес — во фрагменте (`#/<холст>/<экран>?theme=dark&lang=en`): так копия
  работает и с диска, и с сервера, а «назад» браузера ходит по экранам. Без экрана во
  фрагменте — входная страница со списком экранов. Экран рисуется во фрейме, у каждого холста
  свой документ фрейма со своими стилями: стили холстов друг другу не мешают, а точки
  перелома kabinet.css видят ширину фрейма — телефонный артборд (390×844) рисуется фреймом
  390×844 и получает узкую раскладку. Модуль исполняется в окне фрейма (`Function` фрейма),
  поэтому элементы, DOMParser и логика артбордов — фрейма, как в static-view.html.
  Переходы артборда — полные адреса этой страницы с фрагментом, а `<base target="_top">`
  фрейма ведёт их в верхнее окно: щелчок меняет фрагмент без перезагрузки, а «открыть в новой
  вкладке» открывает тот же экран.
-->

<script>
/** Вид по умолчанию — как у холстов: светлая тема, русский язык. */
const DEFAULT_VIEW = { theme: 'light', lang: 'ru' };
const THEMES = ['light', 'dark'];
const LANGS = ['ru', 'en'];

/**
 * Разобрать фрагмент адреса: `#/<холст>/<экран>?theme=…&lang=…`. Без экрана — входная
 * страница. Негодные тема и язык заменяются видом по умолчанию.
 */
function parseRoute(hash) {
  const [path, query = ''] = hash.replace(/^#/, '').split('?');
  const params = new URLSearchParams(query);
  const [canvas = '', board = ''] = path.split('/').filter(Boolean);
  return {
    canvas, board,
    view: {
      theme: THEMES.includes(params.get('theme')) ? params.get('theme') : DEFAULT_VIEW.theme,
      lang: LANGS.includes(params.get('lang')) ? params.get('lang') : DEFAULT_VIEW.lang,
    },
  };
}

/** Фрагмент адреса экрана `board` холста `canvas` в виде `view`; без холста — входная страница. */
function routeHash(canvas, board, view) {
  const query = new URLSearchParams([['theme', view.theme], ['lang', view.lang]]);
  return canvas ? `#/${canvas}/${board}?${query}` : `#/?${query}`;
}

/** Адрес этой страницы без фрагмента: переходы во фрейме — полные адреса, см. шапку. */
const PAGE_URL = location.href.split('#')[0];

function element(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

/**
 * Копия по данным сборки: холсты, их экраны и рисование. Данные приходят одним объектом —
 * так шаг 3 задачи 39 сможет отдавать их после расшифровки, не трогая остального.
 */
function startCopy(data) {
  const canvases = new Map(data.canvases.map((canvas) => [canvas.name, canvas]));
  for (const canvas of data.canvases) canvas.boardsByName = new Map(canvas.boards.map((board) => [board.name, board]));
  const canvasByArtifact = new Map(data.canvases.map((canvas) => [canvas.artifact, canvas]));

  const index = document.getElementById('pc-index');
  const stage = document.getElementById('pc-stage');
  const iframe = document.getElementById('pc-frame');
  const canvasSelect = document.getElementById('pc-canvas');
  const screenSelect = document.getElementById('pc-screen');
  const home = document.getElementById('pc-home');

  /** Последний разобранный адрес — его вид несут переключатели и списки. */
  let route = parseRoute(location.hash);

  /**
   * Экраны холста для списков: страницы холста в порядке canvas.json, на странице — экран и
   * под ним его состояния. Состояние — артборд `<Экран>-…` той же страницы; артборд без
   * своего экрана (`<Часть>-…` без артборда `<Часть>`) стоит сам по себе. Части каркаса не
   * показываются.
   */
  function screenTree(canvas) {
    return canvas.pages.map((page) => {
      const boards = canvas.boards.filter((board) => board.page === page.id && !canvas.parts.includes(board.name));
      const screens = [];
      const byName = new Map();
      for (const board of boards) {
        const base = board.name.split('-')[0];
        const parent = base !== board.name && byName.get(base);
        if (parent) {
          parent.states.push(board);
        } else {
          const screen = { board, states: [] };
          screens.push(screen);
          byName.set(board.name, screen);
        }
      }
      return { page, screens };
    }).filter((group) => group.screens.length);
  }

  /**
   * Название состояния под его экраном: без повтора названия экрана
   * («<Экран> — <состояние>» под «<Экран>» — «<состояние>»).
   */
  function stateTitle(screen, state) {
    const prefix = screen.board.title + ' — ';
    return state.title.startsWith(prefix) ? state.title.slice(prefix.length) : state.title;
  }

  function showIndex(notice) {
    document.title = 'Кабинет провайдера — макеты';
    const built = new Date(data.built);
    const date = new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit',
      minute: '2-digit', timeZone: 'UTC' }).format(built);
    const nodes = [
      element('h1', { textContent: 'Кабинет провайдера — макеты' }),
      element('p', { className: 'pc-build', textContent: `Снимок холстов от ${date} UTC, коммит ${data.commit}${data.dirty ? ' с незакоммиченными правками' : ''}` }),
    ];
    if (notice) nodes.push(element('p', { className: 'pc-notice', textContent: notice }));
    for (const canvas of data.canvases) {
      nodes.push(element('h2', { textContent: canvas.title }));
      for (const { page, screens } of screenTree(canvas)) {
        nodes.push(element('h3', { textContent: page.name }));
        nodes.push(element('ul', { className: 'pc-screens' }, screens.map((screen) => element('li', {}, [
          element('a', { href: routeHash(canvas.name, screen.board.name, route.view), textContent: screen.board.title }),
          ...(screen.states.length ? [element('ul', { className: 'pc-states' }, screen.states.map((state) => element('li', {}, [
            element('a', { href: routeHash(canvas.name, state.name, route.view), textContent: stateTitle(screen, state) }),
          ])))] : []),
        ]))));
      }
    }
    index.replaceChildren(element('div', { className: 'pc-index-inner' }, nodes));
    index.hidden = false;
    stage.hidden = true;
    for (const node of document.querySelectorAll('.pc-board-only')) node.hidden = true;
  }

  /** Списки панели — холст и его экраны; выбранным — нарисованный. */
  function fillSelects(canvas, board) {
    canvasSelect.replaceChildren(...data.canvases.map((item) => element('option', { value: item.name, textContent: item.title })));
    canvasSelect.value = canvas.name;
    screenSelect.replaceChildren(...screenTree(canvas).map(({ page, screens }) => element('optgroup', { label: page.name },
      screens.flatMap((screen) => [screen.board, ...screen.states]).map((item) => element('option', { value: item.name, textContent: item.title })))));
    screenSelect.value = board.name;
    for (const node of document.querySelectorAll('.pc-board-only')) node.hidden = false;
  }

  /** Документ фрейма холста: его стили целиком, шрифты, `<base target="_top">` и место экрана. */
  function frameDocument(canvas) {
    const styles = canvas.styles.map((css) => `<style>${css}</style>`).join('\n');
    return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
${styles}
<style>body{margin:0}</style></head><body><div id="kc-root"></div></body></html>`;
  }

  /** Фрейм нарисованного холста: имя холста, окно фрейма и рисовальщик в нём. */
  let frame = null;

  /**
   * Открыть во фрейме документ холста и рисовальщик в окне фрейма. Модуль исполняется
   * `Function` фрейма — его `document`, DOMParser и `Node` фрейма, — с крючками копии:
   * файлы — из данных, переход и ссылка на другой холст — адрес этой страницы, ассет — data:.
   */
  async function openFrame(canvas) {
    const loaded = new Promise((resolve) => iframe.addEventListener('load', resolve, { once: true }));
    iframe.srcdoc = frameDocument(canvas);
    await loaded;
    const frameWindow = iframe.contentWindow;
    const { createRenderer } = new frameWindow.Function(data.renderer)();
    const file = (path) => {
      const text = canvas.files[path];
      return { ok: text != null, status: text != null ? 200 : 404, text: async () => text, json: async () => JSON.parse(text) };
    };
    const viewOf = (carried) => ({ ...DEFAULT_VIEW, ...Object.fromEntries(carried) });
    const renderer = createRenderer({
      canvas: canvas.name,
      fetchFile: async (path) => file(path),
      boardHref: (target, carried) => PAGE_URL + routeHash(canvas.name, target, viewOf(carried)),
      artifactHref: (id, carried) => {
        const other = canvasByArtifact.get(id);
        return other ? PAGE_URL + routeHash(other.name, other.launchBoard, viewOf(carried)) : null;
      },
      asset: (path) => data.assets[path],
    });
    frame = { canvas: canvas.name, window: frameWindow, renderer };
  }

  /** Нарисовать экран `board` холста `canvas` в виде `view`. */
  async function showBoard(canvas, board, view) {
    document.title = `${board.title} — ${canvas.title}`;
    index.hidden = true;
    stage.hidden = false;
    fillSelects(canvas, board);
    stage.className = 'pc-stage ' + (board.phone ? 'pc-stage-phone' : 'pc-stage-full');
    if (frame?.canvas !== canvas.name) await openFrame(canvas);
    const root = frame.window.document.getElementById('kc-root');
    try {
      await frame.renderer.render(root, board.name, { theme: view.theme, lang: view.lang });
    } catch (error) {
      console.error(error);
      root.replaceChildren(Object.assign(frame.window.document.createElement('p'), {
        className: 'pc-message', textContent: `Экран не нарисовался: ${error.message}` }));
    }
    frame.window.scrollTo(0, 0);
  }

  /** Фрагмент адреса, показанный последним, — для прогона всех экранов. */
  let shownHash = null;

  /** Показать то, что называет адрес: экран или входную страницу (с пометкой, если экрана нет). */
  async function show() {
    const hash = location.hash;
    await showRoute();
    shownHash = hash;
  }

  async function showRoute() {
    route = parseRoute(location.hash);
    document.documentElement.dataset.theme = route.view.theme;
    for (const button of document.querySelectorAll('[data-theme-choice]')) button.setAttribute('aria-pressed', String(button.dataset.themeChoice === route.view.theme));
    for (const button of document.querySelectorAll('[data-lang-choice]')) button.setAttribute('aria-pressed', String(button.dataset.langChoice === route.view.lang));
    home.href = routeHash('', '', route.view);
    const canvas = canvases.get(route.canvas);
    const board = canvas?.boardsByName.get(route.board);
    if (board) return showBoard(canvas, board, route.view);
    if (route.canvas || route.board) return showIndex(`Экрана «${[route.canvas, route.board].filter(Boolean).join('/')}» в копии нет. Экраны холстов:`);
    return showIndex();
  }

  /**
   * Показы — по очереди: быстрые щелчки «назад» не должны рисовать два экрана в один фрейм
   * одновременно. `idle` — обещание конца последнего показа (для прогона всех экранов).
   */
  let queue = Promise.resolve();
  const enqueue = () => (queue = queue.then(show, show));
  window.addEventListener('hashchange', enqueue);

  /**
   * Смена вида — без новой записи в истории: «назад» ведёт к прошлому экрану, а не к прошлой
   * теме. Вид и экран — из адреса, а не из последнего показа: показ идёт после события
   * hashchange, и второй быстрый щелчок (тема, сразу за ней язык) иначе потерял бы первый.
   */
  const replaceView = (patch) => {
    const current = parseRoute(location.hash);
    const valid = canvases.get(current.canvas)?.boardsByName.has(current.board);
    location.replace(PAGE_URL + routeHash(valid ? current.canvas : '', current.board, { ...current.view, ...patch }));
  };
  for (const button of document.querySelectorAll('[data-theme-choice]')) button.addEventListener('click', () => replaceView({ theme: button.dataset.themeChoice }));
  for (const button of document.querySelectorAll('[data-lang-choice]')) button.addEventListener('click', () => replaceView({ lang: button.dataset.langChoice }));
  canvasSelect.addEventListener('change', () => {
    const canvas = canvases.get(canvasSelect.value);
    location.hash = routeHash(canvas.name, canvas.launchBoard, parseRoute(location.hash).view);
  });
  // Холст — нарисованный: список экранов — его.
  screenSelect.addEventListener('change', () => { location.hash = routeHash(canvasSelect.value, screenSelect.value, parseRoute(location.hash).view); });

  /**
   * Для проверки копии: данные, конец последнего показа, показанный фрагмент адреса и
   * рисовальщик открытого фрейма. Прогон ждёт `shown()`, а не события hashchange: браузер
   * под управлением инструментов отладки может его потерять.
   */
  window.publicCopy = { data, idle: () => queue, shown: () => shownHash, frame: () => frame };
  document.querySelector('.pc-bar').hidden = false;
  enqueue();
}

/**
 * Ключ верного пароля в sessionStorage — под именем с солью сборки: у новой сборки соль своя,
 * и ключ прежней к ней не прикладывается, а спрашивается пароль.
 */
const KEY_STORE_PREFIX = 'pc-key:';

const fromBase64 = (text) => Uint8Array.from(atob(text), (char) => char.charCodeAt(0));
const toBase64 = (bytes) => btoa(Array.from(new Uint8Array(bytes), (byte) => String.fromCharCode(byte)).join(''));

/**
 * sessionStorage может бросить исключение (запрещённые данные сайта, некоторые окна с диска):
 * тогда копия просто спрашивает пароль каждый раз.
 */
const sessionStore = {
  get: (name) => { try { return sessionStorage.getItem(name); } catch { return null; } },
  set: (name, value) => { try { sessionStorage.setItem(name, value); } catch { /* пароль спросят снова */ } },
  remove: (name) => { try { sessionStorage.removeItem(name); } catch { /* нечего убирать */ } },
};

/**
 * Ключ AES из пароля — как в `seal()` сборщика: PBKDF2-SHA-256 с солью и числом итераций из
 * данных, пароль без пробелов по краям и в NFC. Ключ извлекаемый — его сырые байты хранятся
 * до закрытия вкладки.
 */
async function deriveKey(password, sealed) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.trim().normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: fromBase64(sealed.salt), iterations: sealed.iterations },
    material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

/**
 * Расшифровать и распаковать данные копии. Неверный ключ — исключение `OperationError` от
 * AES-GCM: тег не сходится, и ни байта открытого текста не отдаётся.
 */
async function openSealed(sealed, key) {
  const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(sealed.iv) }, key, fromBase64(sealed.data));
  const stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

/**
 * Открыть копию. Есть ключ этой сборки в sessionStorage — открыть им без формы; нет или не
 * подошёл — форма пароля. Верный пароль — ключ в sessionStorage и копия; неверный — сообщение
 * под полем. Тема формы — из адреса, как у копии.
 */
async function unlock() {
  const sealed = JSON.parse(document.getElementById('pc-data').textContent);
  document.documentElement.dataset.theme = parseRoute(location.hash).view.theme;
  const lock = document.getElementById('pc-lock');
  const form = document.getElementById('pc-lock-form');
  const input = document.getElementById('pc-password');
  const button = document.getElementById('pc-unlock');
  const error = document.getElementById('pc-lock-error');
  const say = (text) => { error.textContent = text; error.hidden = !text; };
  const open = (data) => { lock.hidden = true; startCopy(data); };

  if (!window.crypto?.subtle || typeof DecompressionStream !== 'function') {
    lock.hidden = false;
    input.disabled = button.disabled = true;
    say('Этот браузер макеты не откроет: нужен адрес https:// или файл с диска в свежей версии Chrome, Safari, Firefox или Edge.');
    return;
  }

  const storeName = KEY_STORE_PREFIX + sealed.salt;
  const saved = sessionStore.get(storeName);
  if (saved) {
    try {
      const key = await crypto.subtle.importKey('raw', fromBase64(saved), 'AES-GCM', false, ['decrypt']);
      return open(await openSealed(sealed, key));
    } catch {
      sessionStore.remove(storeName);
    }
  }

  lock.hidden = false;
  input.focus();
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    say('');
    button.disabled = true;
    button.textContent = 'Открываю…';
    try {
      const key = await deriveKey(input.value, sealed);
      const data = await openSealed(sealed, key);
      sessionStore.set(storeName, toBase64(await crypto.subtle.exportKey('raw', key)));
      open(data);
    } catch (failure) {
      say(failure?.name === 'OperationError' ? 'Пароль не подошёл.' : `Не открылось: ${failure?.message ?? failure}`);
      input.select();
    } finally {
      button.disabled = false;
      button.textContent = 'Открыть';
    }
  });
}

unlock();
</script>
</body>
</html>
